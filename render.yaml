services:
  - type: web
    name: atl-research-service
    runtime: python
    plan: 0.5c-512mb

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: SQLITE_PATH
        value: /var/data/atl_runs.db

      - key: X_SERVICE_TOKEN
        sync: false

    disk:
      name: atl-data
      mountPath: /var/data
      sizeGB: 1
