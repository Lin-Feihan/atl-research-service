services:
  - type: web
    name: atl-research-service
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: X_SERVICE_TOKEN
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_BASE_URL
        sync: false
